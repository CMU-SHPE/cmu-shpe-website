name: Clean up preview database

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  delete-neon-branch:
    # Workflows from forks don't receive the Neon API key.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the pull request's preview database branch
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH_NAME: preview/${{ github.head_ref }}
        run: |
          api="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches"
          branch_id=$(curl -fsS "$api" -H 'accept: application/json' -H "Authorization: Bearer $NEON_API_KEY" \
            | jq -r --arg name "$BRANCH_NAME" '[.branches[] | select(.name == $name and (.default | not)) | .id] | first // empty')
          if [ -z "$branch_id" ]; then
            echo "No Neon branch named $BRANCH_NAME; nothing to delete."
            exit 0
          fi
          curl -fsS -X DELETE "$api/$branch_id" -H 'accept: application/json' -H "Authorization: Bearer $NEON_API_KEY" > /dev/null
          echo "Deleted Neon branch $BRANCH_NAME ($branch_id)."
